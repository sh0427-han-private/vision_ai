name: Validate concept dependency graph

on:
  pull_request:
    paths:
      - 'planning/**'
      - 'scripts/validate_concept_graph.py'
      - 'scripts/test_validate_concept_graph.py'
      - 'scripts/build.py'
      - 'scripts/foundations_note.py'
      - 'scripts/p4_examples.py'
      - 'scripts/test_p4_examples.py'
      - 'scripts/reference_notes.py'
      - 'scripts/cs231n_note.py'
      - 'scripts/prml_note.py'
      - 'notes/**'
      - '.github/workflows/concept-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current pages before checking anchors
        run: python3 scripts/build.py
      - name: Check site and JavaScript legacy contracts
        run: |
          python3 scripts/validate.py
          node --check assets/site.js
      - name: Check concept references, curriculum, and existing anchors
        run: python3 scripts/validate_concept_graph.py
      - name: Run P4 numeric examples
        run: python3 -m unittest discover -s scripts -p test_p4_examples.py -v
      - name: Run mutation regression tests
        run: python3 -m unittest discover -s scripts -p test_validate_concept_graph.py -v
