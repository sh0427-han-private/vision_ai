<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="Figure 5. Receptive-field growth">
<style>
.title{font:700 27px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#18243b}
.subtitle{font:18px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#5b6880}
.panel-label{font:700 19px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#18243b}
.label{font:700 18px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#203455}
.body{font:16px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#526178}
.small{font:14px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#68768c}
.white{font:700 16px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#fff}
.panel{fill:#fff;stroke:#d2dceb;stroke-width:2}
.soft{fill:#f3f7fe;stroke:#c9d6ea;stroke-width:2}
.blue{fill:#edf3ff;stroke:#8faee8;stroke-width:2}
.green{fill:#e9f7f2;stroke:#8ccdbb;stroke-width:2}
