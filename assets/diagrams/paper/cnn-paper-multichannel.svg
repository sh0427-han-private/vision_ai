<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Figure 3. Multi-channel convolution">
<style>
.title{font:700 27px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#18243b}
.subtitle{font:18px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#5b6880}
.panel-label{font:700 19px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#18243b}
.label{font:700 18px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#203455}
.body{font:16px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#526178}
.small{font:14px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#68768c}
.white{font:700 16px 'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#fff}
.panel{fill:#fff;stroke:#d2dceb;stroke-width:2}
.soft{fill:#f3f7fe;stroke:#c9d6ea;stroke-width:2}
.blue{fill:#edf3ff;stroke:#8faee8;stroke-width:2}
.green{fill:#e9f7f2;stroke:#8ccdbb;stroke-width:2}
.orange{fill:#fff1e7;stroke:#e0ae82;stroke-width:2}
.line{stroke:#7e91af;stroke-width:3;fill:none}
.thin{stroke:#a8b5c8;stroke-width:2;fill:none}
</style>
<rect width="1200" height="700" rx="24" fill="#f8fafc"/>
<text x="42" y="48" class="title">Figure 3. Multi-channel convolution</text>
<text x="42" y="78" class="subtitle">RGB channel별 계산이 합쳐져 하나의 output channel을 구성합니다.</text>
<rect x="35" y="125" width="180" height="250" rx="18" class="panel"/><text x="53" y="155" class="panel-label">(a)</text><text x="93" y="155" class="label">R channel</text><rect x="67" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="101" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="135" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="67" y="219" width="31" height="31" rx="4" fill="#768397" stroke="#d5deeb"/><rect x="101" y="219" width="31" height="31" rx="4" fill="#344156" stroke="#d5deeb"/><rect x="135" y="219" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="67" y="253" width="31" height="31" rx="4" fill="#d9dee6" stroke="#d5deeb"/><rect x="101" y="253" width="31" height="31" rx="4" fill="#768397" stroke="#d5deeb"/><rect x="135" y="253" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="78" y="304" width="95" height="34" rx="8" fill="#f8dede" stroke="#b9c7da"/><text x="125" y="326" text-anchor="middle" class="body">conv R</text><rect x="245" y="125" width="180" height="250" rx="18" class="panel"/><text x="263" y="155" class="panel-label">(b)</text><text x="303" y="155" class="label">G channel</text><rect x="277" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="311" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="345" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="277" y="219" width="31" height="31" rx="4" fill="#768397" stroke="#d5deeb"/><rect x="311" y="219" width="31" height="31" rx="4" fill="#344156" stroke="#d5deeb"/><rect x="345" y="219" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="277" y="253" width="31" height="31" rx="4" fill="#d9dee6" stroke="#d5deeb"/><rect x="311" y="253" width="31" height="31" rx="4" fill="#768397" stroke="#d5deeb"/><rect x="345" y="253" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="288" y="304" width="95" height="34" rx="8" fill="#e0f2df" stroke="#b9c7da"/><text x="335" y="326" text-anchor="middle" class="body">conv G</text><rect x="455" y="125" width="180" height="250" rx="18" class="panel"/><text x="473" y="155" class="panel-label">(c)</text><text x="513" y="155" class="label">B channel</text><rect x="487" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="521" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="555" y="185" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="487" y="219" width="31" height="31" rx="4" fill="#768397" stroke="#d5deeb"/><rect x="521" y="219" width="31" height="31" rx="4" fill="#344156" stroke="#d5deeb"/><rect x="555" y="219" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="487" y="253" width="31" height="31" rx="4" fill="#d9dee6" stroke="#d5deeb"/><rect x="521" y="253" width="31" height="31" rx="4" fill="#768397" stroke="#d5deeb"/><rect x="555" y="253" width="31" height="31" rx="4" fill="#f4f5f7" stroke="#d5deeb"/><rect x="498" y="304" width="95" height="34" rx="8" fill="#e1e9fa" stroke="#b9c7da"/><text x="545" y="326" text-anchor="middle" class="body">conv B</text><rect x="675" y="125" width="215" height="250" rx="18" class="panel"/><text x="693" y="155" class="panel-label">(d)</text><text x="733" y="155" class="label">sum across channels</text><text x="710" y="200" class="label">R response</text><text x="710" y="245" class="label">+ G response</text><text x="710" y="290" class="label">+ B response</text><text x="710" y="335" class="body">+ bias</text><rect x="920" y="125" width="245" height="250" rx="18" class="panel"/><text x="938" y="155" class="panel-label">(e)</text><text x="978" y="155" class="label">one output channel</text><rect x="970" y="190" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="1007" y="190" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="1044" y="190" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="1081" y="190" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="970" y="227" width="34" height="34" rx="4" fill="#7fa4ec" stroke="#d5deeb"/><rect x="1007" y="227" width="34" height="34" rx="4" fill="#2f63d8" stroke="#d5deeb"/><rect x="1044" y="227" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="1081" y="227" width="34" height="34" rx="4" fill="#dce7fa" stroke="#d5deeb"/><rect x="970" y="264" width="34" height="34" rx="4" fill="#dce7fa" stroke="#d5deeb"/><rect x="1007" y="264" width="34" height="34" rx="4" fill="#7fa4ec" stroke="#d5deeb"/><rect x="1044" y="264" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="1081" y="264" width="34" height="34" rx="4" fill="#bcd1f6" stroke="#d5deeb"/><rect x="970" y="301" width="34" height="34" rx="4" fill="#2f63d8" stroke="#d5deeb"/><rect x="1007" y="301" width="34" height="34" rx="4" fill="#bcd1f6" stroke="#d5deeb"/><rect x="1044" y="301" width="34" height="34" rx="4" fill="#f0f4fb" stroke="#d5deeb"/><rect x="1081" y="301" width="34" height="34" rx="4" fill="#7fa4ec" stroke="#d5deeb"/><path d="M635 250 L665 250" class="line"/><polygon points="665,250 651,241 651,259" fill="#7e91af"/><path d="M890 250 L912 250" class="line"/><polygon points="912,250 898,241 898,259" fill="#7e91af"/><rect x="120" y="425" width="960" height="230" rx="18" class="panel"/><text x="138" y="455" class="panel-label">(f)</text><text x="178" y="455" class="label">Weight tensor</text><text x="165" y="495" class="body">RGB 입력 → 32 output channels, kernel 3×3일 때</text><text x="165" y="545" class="label">W ∈ R^[32 × 3 × 3 × 3]</text><text x="165" y="590" class="body">한 output channel은 입력 3개 channel의 convolution response를 합쳐 만듭니다.</text><text x="165" y="625" class="small">1×1 convolution도 공간 이웃은 보지 않지만 channel mixing은 수행합니다.</text>
</svg>