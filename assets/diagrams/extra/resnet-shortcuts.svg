<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<style>
text{font-family:'NanumGothic','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif}
.t{font-size:30px;font-weight:700;fill:#203455}
.s{font-size:18px;fill:#5b6880}
.l{font-size:20px;font-weight:700;fill:#203455}
.m{font-size:16px;fill:#5b6880}
.edge{stroke:#7891b7;stroke-width:4;fill:none}
.thin{stroke:#9aabc7;stroke-width:2;fill:none}
</style>
<rect width="1200" height="520" rx="28" fill="#f7f9fc"/>
<text x="48" y="58" class="t">Identity vs Projection shortcut</text>
<text x="48" y="91" class="s">element-wise add를 위해 두 branch의 output shape가 같아야 합니다.</text>
<rect x="65" y="145" width="500" height="300" rx="20" fill="#fff" stroke="#c7d5ee" stroke-width="3"/><text x="315" y="190" text-anchor="middle" class="l">Identity shortcut</text><rect x="635" y="145" width="500" height="300" rx="20" fill="#fff" stroke="#c7d5ee" stroke-width="3"/><text x="885" y="190" text-anchor="middle" class="l">Projection shortcut</text><rect x="110" y="245" width="120" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="170.0" y="278.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">x</text><text x="170.0" y="309.0" text-anchor="middle" font-size="15" fill="#5b6880">64×56×56</text><rect x="330" y="245" width="140" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="400.0" y="278.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">F(x)</text><text x="400.0" y="309.0" text-anchor="middle" font-size="15" fill="#5b6880">same shape</text><circle cx="510" cy="285" r="28" fill="#e9f7f2" stroke="#08796f" stroke-width="3"/><text x="510" y="293" text-anchor="middle" class="l">+</text><path d="M230 285 L325 285" class="edge"/><polygon points="325,285 307,273 307,297" fill="#7891b7"/><path d="M470 285 L480 285" class="edge"/><polygon points="480,285 462,273 462,297" fill="#7891b7"/><path d="M170 242 C220 205 425 205 510 255" stroke="#08796f" stroke-width="4" fill="none"/><rect x="680" y="245" width="120" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="740.0" y="278.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">x</text><text x="740.0" y="309.0" text-anchor="middle" font-size="15" fill="#5b6880">64×56×56</text><rect x="865" y="205" width="150" height="72" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="940.0" y="234.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">F(x)</text><text x="940.0" y="265.0" text-anchor="middle" font-size="15" fill="#5b6880">128×28×28</text><rect x="865" y="315" width="150" height="72" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="940.0" y="344.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">1×1, s=2</text><text x="940.0" y="375.0" text-anchor="middle" font-size="15" fill="#5b6880">projection</text><circle cx="1080" cy="285" r="28" fill="#e9f7f2" stroke="#08796f" stroke-width="3"/><text x="1080" y="293" text-anchor="middle" class="l">+</text><path d="M800 285 L858 241" class="edge"/><polygon points="858,241 840,229 840,253" fill="#7891b7"/><path d="M800 285 L858 351" class="edge"/><polygon points="858,351 840,339 840,363" fill="#7891b7"/><path d="M1015 241 L1050 275" class="edge"/><polygon points="1050,275 1032,263 1032,287" fill="#7891b7"/><path d="M1015 351 L1050 295" class="edge"/><polygon points="1050,295 1032,283 1032,307" fill="#7891b7"/><text x="315" y="405" text-anchor="middle" class="m">shape가 같으면 parameter-free identity</text><text x="885" y="420" text-anchor="middle" class="m">shape가 다르면 projection으로 맞춘 뒤 add</text></svg>