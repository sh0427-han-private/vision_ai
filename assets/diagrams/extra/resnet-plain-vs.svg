<rect width="1200" height="520" rx="28" fill="#f7f9fc"/>
<text x="48" y="58" class="t">Plain network vs Residual network</text>
<text x="48" y="91" class="s">Residual block은 main branch와 identity shortcut을 합산합니다.</text>
<text x="300" y="150" text-anchor="middle" class="l">Plain block</text><text x="900" y="150" text-anchor="middle" class="l">Residual block</text><rect x="80" y="220" width="120" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="140.0" y="253.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">x</text><text x="140.0" y="284.0" text-anchor="middle" font-size="15" fill="#5b6880">input</text><rect x="245" y="220" width="145" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="317.5" y="253.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">F₁</text><text x="317.5" y="284.0" text-anchor="middle" font-size="15" fill="#5b6880">conv</text><rect x="435" y="220" width="120" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="495.0" y="253.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">H(x)</text><text x="495.0" y="284.0" text-anchor="middle" font-size="15" fill="#5b6880">output</text><path d="M200 260 L240 260" class="edge"/><polygon points="240,260 222,248 222,272" fill="#7891b7"/><path d="M390 260 L430 260" class="edge"/><polygon points="430,260 412,248 412,272" fill="#7891b7"/><rect x="650" y="220" width="120" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="710.0" y="253.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">x</text><text x="710.0" y="284.0" text-anchor="middle" font-size="15" fill="#5b6880">input</text><rect x="815" y="220" width="145" height="80" rx="14" fill="#fff" stroke="#c7d5ee" stroke-width="2"/><text x="887.5" y="253.0" text-anchor="middle" font-size="19" font-weight="700" fill="#203455">F(x)</text><text x="887.5" y="284.0" text-anchor="middle" font-size="15" fill="#5b6880">residual</text><circle cx="1030" cy="260" r="34" fill="#e9f7f2" stroke="#08796f" stroke-width="3"/><text x="1030" y="268" text-anchor="middle" class="l">+</text><path d="M770 260 L810 260" class="edge"/><polygon points="810,260 792,248 792,272" fill="#7891b7"/><path d="M960 260 L994 260" class="edge"/><polygon points="994,260 976,248 976,272" fill="#7891b7"/><path d="M710 218 C785 160 945 160 1030 224" stroke="#08796f" stroke-width="5" fill="none"/><polygon points="1030,224 1014,209 1038,209" fill="#08796f"/><text x="870" y="205" text-anchor="middle" class="m">identity shortcut x</text><text x="300" y="385" text-anchor="middle" class="m">H(x)를 직접 근사</text><text x="900" y="385" text-anchor="middle" class="m">H(x)=F(x)+x</text></svg>